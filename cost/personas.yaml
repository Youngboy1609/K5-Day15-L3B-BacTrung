# Bản CP3 — chi phí model cho đợt dùng thử trợ lý review ốp điện thoại.
# Kiểm luồng khi đã nối model: python run.py simulate --try
# CP4 sau khi chấm lượt 2: python run.py simulate --rate-from eval/run-2.csv

sessions: 50
seed: 42

users: # Số người dùng hoạt động trong một tháng.
  low: 30
  base: 100
  high: 300
  source: "(tự ước tính) Ba mức quy mô của đợt dùng thử ốp điện thoại, cần nhóm xác nhận theo kênh tuyển người dùng."

# Tỷ trọng tạm tính từ evidence/survey/results.csv (bản lọc tạm 27/11/2026).
# Tập tính gồm 42 phản hồi chọn Shopee, lần gần nhất trong 90 ngày và có đọc review theo Q6.
# Chia theo Q3 (số lần cân nhắc mua hàng trên các sàn trong 30 ngày).
# Q3 dùng để ước lượng tỷ trọng ban đầu. Tần suất dùng app và nhóm người mua ốp
# cần đo riêng khi dùng thử.
personas:
  - name: mua_sam_it
    share: 0.262
    uses_per_month: 1
    turns_per_session: 1
    source: "Q3 từ 0 đến 3 lần: 11/42. Số phiên và lượt phân tích (tự ước tính): kiểm một ốp khi có nhu cầu."
  - name: mua_sam_vua
    share: 0.357
    uses_per_month: 2
    turns_per_session: 1
    source: "Q3 từ 4 đến 9 lần: 15/42. Số phiên và lượt phân tích (tự ước tính): kiểm một ốp trong mỗi phiên."
  - name: mua_sam_thuong_xuyen
    share: 0.381
    uses_per_month: 4
    turns_per_session: 2
    source: "Q3 từ 10 lần trở lên: 16/42. Số phiên và lượt phân tích (tự ước tính): xem hai lựa chọn trong một phiên."

# Đơn vị: USD / 1 triệu token, gói Standard trả phí, đầu vào tính theo giá không cache.
# Lượt mô phỏng CP4 đã nộp đo token trên openai/gpt-4o-mini qua OpenRouter.
# Lượt đối chứng riêng đo trên gpt-4o; Gemini 3.1 Flash-Lite là mức giá tham chiếu.
# Tên model phải khớp cột model trong file đánh giá để dùng đúng giá và tỉ lệ đạt.
prices:
  - model: openai/gpt-4o-mini
    input: 0.15
    output: 0.60
    source: "OpenRouter, xem 28/11/2026: https://openrouter.ai/openai/gpt-4o-mini (provider OpenAI: $0.15 vào / $0.60 ra). Khớp trang OpenAI https://developers.openai.com/api/docs/models/gpt-4o-mini, trang này đánh dấu model là Deprecated."
  - model: gpt-4o
    input: 2.50
    output: 10.00
    source: "OpenAI API, xem 27/11/2026: https://developers.openai.com/api/docs/models/gpt-4o"
  - model: gemini-3.1-flash-lite
    input: 0.25
    output: 1.50
    source: "Google AI Studio, xem 27/11/2026: https://aistudio.google.com/docs/pricing#gemini-3.1-flash-lite"

usd_to_vnd: # Tuỳ chọn.
  rate:
  source:
