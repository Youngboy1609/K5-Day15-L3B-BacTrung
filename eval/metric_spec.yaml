# CP2 locked standard; do not change after CP2 submission.
metrics:
  - name: dung_listing_bien_the
    definition: "Tỷ lệ review được phân tích có product_id, phone_model và case_variant khớp chính xác lựa chọn; chấm bằng cách đối chiếu từng review_assessments.review_id với data/reviews.json."
    grader: code
    threshold: "100% trên mọi câu có status=ok"
    why: "Khó khăn về đánh giá không liên quan mẫu/size/phiên bản được 16/42 người trong tập khảo sát chính chọn; một tình huống ốp cụ thể ở evidence/summary.md."
  - name: truy_vet_dan_chung
    definition: "Tỷ lệ evidence.review_id tồn tại trong review đã lấy mẫu và evidence.review_text bằng nguyên văn text nguồn tương ứng."
    grader: code
    threshold: "100% mọi evidence trong mọi output status=ok"
    why: "Người mua cần kiểm tra căn cứ cho gợi ý; survey có 28/42 người chọn review ngắn/thiếu thông tin và 28/42 nghi ngờ độ tin cậy."
  - name: tu_choi_khi_thieu_can_cu
    definition: "Tỷ lệ URL ngoài fixture, host không hợp lệ, biến thể không khớp hoặc JSON/schema sai được trả error/needs_input và không có recommendation."
    grader: code
    threshold: "100% các input không hợp lệ/không có dữ liệu"
    why: "Tránh khuyến nghị dựa trên review không áp dụng; media chưa rõ là lựa chọn được 20/42 người ghi nhận trong khảo sát."
