# trước khi nộp CP2. Sau khi khóa, không sửa file này.
#
# Người chấm thứ hai cần chấm độc lập cùng 5 đầu ra; ghi kết quả thật vào eval/README.md.
metrics:
  - name: dung_bien_the
    definition: "Tỷ lệ kết quả chỉ trích dẫn review khớp chính xác product_id, phone_model và case_variant người dùng chọn."
    grader: code
    threshold: "100% review được trích dẫn"
    why: "Giảm nguy cơ người mua áp nhận xét của dòng máy hoặc mẫu ốp khác lên sản phẩm định mua; giả thuyết pain ở evidence/hypothesis.md."
  - name: dan_chung_ton_tai
    definition: "Tỷ lệ mã review được nêu trong output tồn tại trong tập review đã lấy mẫu và phần trích dẫn khớp nội dung nguồn."
    grader: code
    threshold: "100% mã review và nội dung trích dẫn khớp nguồn"
    why: "Người mua cần tự kiểm được căn cứ thay vì tin một lời khuyên không truy vết."
  - name: tu_choi_khi_thieu_can_cu
    definition: "Tỷ lệ input link không có trong fixture hoặc biến thể không khớp được trả lỗi/hỏi lại, không có khuyến nghị mua."
    grader: code
    threshold: "100% ca link/biến thể không hợp lệ không đưa khuyến nghị"
    why: "Khuyến nghị sai link hoặc sai biến thể có thể khiến người mua quyết định dựa trên review không liên quan."
